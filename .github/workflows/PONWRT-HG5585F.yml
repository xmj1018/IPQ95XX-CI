name: PONWRT-HG5585F

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: HG5585F-CT
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd dwarves

      - name: Clone PonWrt upstream (untouched)
        run: |
          git clone --depth=1 --single-branch --branch master https://github.com/pbs05/ponwrt.git wrt
          echo "UPSTREAM_COMMIT=$(git -C wrt rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Apply HG5585F NPU flow-offload patches
        run: |
          # ★NPU 硬件卸载修复（源自 wuziwei/ponwrt-ZN504-HG5585F，pbs05/ponwrt 的 fork）
          # 已核实：该 fork 相对上游 173 个 airoha 补丁「一个没删、一个没改」，
          # 仅在 patches-6.18/ 下新增这 8 个文件，因此可直接叠加到干净上游树，
          # wuziwei 用「上游 + 这 8 个」正常产出 release，是本步骤可行性的实证。
          # 作用：修 WAN IPv6 PPPoE 流卸载、bridge FDB 端口卸载、PPE SRAM 拥塞、
          #       bridge fastpath 的 TTL/hop-limit 保留 —— 让流量更多走 NPU/PPE 硬件，
          #       减少 CPU 软件转发，提升 NAT/桥接吞吐。
          # 不带 Kconfig 改动，不需要新增 config 符号或固件文件。
          # 当前目录是仓库根，patches/ 就在根下（不要写 ../，会跑到仓库外）
          N=$(ls -1 patches/npu/*.patch 2>/dev/null | wc -l)
          echo "待叠加 NPU 补丁数: $N (应为 8)"
          [ "$N" -eq 8 ] || { echo "ERROR: NPU 补丁数量不对，中止"; exit 1; }
          cp -af patches/npu/*.patch wrt/target/linux/airoha/patches-6.18/
          echo "=== 已叠加的 NPU 补丁 ==="
          ls -1 wrt/target/linux/airoha/patches-6.18/ | grep -E '^(931|932|941|947|951)' || true
          echo "=== airoha 补丁总数 ==="
          ls -1 wrt/target/linux/airoha/patches-6.18/*.patch | wc -l

      - name: Update and install upstream feeds
        run: |
          cd wrt
          # ★关键：上游仓库只带 feeds.conf.default，没有 feeds.conf。
          #   若直接 `>> feeds.conf` 会新建一个只含额外 feed 的文件，
          #   导致 packages / luci / routing / pon_drivers / pon_userspace 全部缺失
          #   （luci-base、luci-theme-argon、sqlite3-cli、v2ray-geoip 等统统找不到）。
          #   先还原上游默认 feed 清单，再全量安装，与上游 release.yml 一致。
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          echo "=== 生效的 feeds.conf ==="
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 缓存 restore：2026-11-28 起 quickstart 锁定为官网固件同款官方 0.13.1 release
      # （从作者官方 linkease/istore-packages 下载、官方 hash），前端 0.12.10-r1，
      # 不再本地重打 tarball。保留在 Add extra feeds 之前，与 WRT-CORE 顺序一致，
      # 避免缓存里可能残留的旧 quickstart 包干扰。
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: wrt/dl
          key: ponwrt-hg5585f-dl-${{ hashFiles('Config/PONWRT-HG5585F.config') }}
          restore-keys: |
            ponwrt-hg5585f-dl-

      - name: Add extra feeds (honk / iStore)
        run: |
          cd wrt
          echo "src-git honk https://github.com/kenzok8/openwrt-honk.git" >> feeds.conf
          echo "src-git partexp https://github.com/sirpdboy/luci-app-partexp.git" >> feeds.conf
          echo "src-git diskman https://github.com/sbwml/luci-app-diskman.git" >> feeds.conf
          # OpenClash 用官方 luci feed 自带的版本（0.48.002，随 feeds install -a 就位），
          # 不另加 vernesong dev 源 —— 依赖更少更稳，与"刷新软件源能装"一致
          # ★iStoreOS 风格插件：2026-11-27 起全部改用项目作者官方源（istoreos），
          #   不再用 kenzok8 中间打包仓（lgz/滞后）。与 SBE1V1K/BE10000 的 PRIVATE.sh 完全一致，
          #   clone 官方 main 分支，每次编译拉最新。
          ./scripts/feeds update honk partexp diskman
          ./scripts/feeds install honk luci-app-honk
          ISTORE_HUB="./package/_istoreos-app-hub"
          ISTORE_LUCI="./package/_istoreos-luci"
          rm -rf "$ISTORE_HUB" "$ISTORE_LUCI"
          git clone --depth=1 --single-branch --branch main "https://github.com/istoreos/istoreos-app-hub.git" "$ISTORE_HUB"
          git clone --depth=1 --single-branch --branch main "https://github.com/istoreos/istore.git" "$ISTORE_LUCI"
          # 删除 feeds 里可能存在的同名包，避免与官方源冲突
          for PKG in quickstart luci-app-quickstart luci-app-istorex luci-app-store taskd luci-lib-taskd luci-lib-xterm; do
            find ./feeds/luci/ ./feeds/packages/ -maxdepth 4 -type d -iname "*$PKG*" -exec rm -rf {} + 2>/dev/null || :
          done
          copy_istore_pkg() {
            local src="$1" name="$2"
            [ -d "$src" ] || { echo "WARN: 官方包源不存在: $src"; return 1; }
            rm -rf "./package/$name"
            cp -af "$src" "./package/$name"
          }
          copy_istore_pkg "$ISTORE_HUB/apps/istorex/luci-app-istorex"       luci-app-istorex
          copy_istore_pkg "$ISTORE_LUCI/luci/luci-app-store"                luci-app-store
          copy_istore_pkg "$ISTORE_LUCI/luci/taskd"                         taskd
          copy_istore_pkg "$ISTORE_LUCI/luci/luci-lib-taskd"                luci-lib-taskd
          copy_istore_pkg "$ISTORE_LUCI/luci/luci-lib-xterm"                luci-lib-xterm

          # ── iStoreOS 首页：整套锁定到「官网固件同款」的官方前端 + 官方后端（2026-11-28） ──
          # 与 SBE1V1K / BE10000 的 Scripts/PRIVATE.sh 完全一致。依据：解压官网 iStoreOS
          # 25.12.6-2026110611 x86_64 官方固件逐项核对 + 读官方源码得出：
          #   - 官网固件首页 = luci-app-quickstart 0.12.10-r1 的 index.js（498KB，5 张卡片
          #     全部写死在前端：网络向导/局域网设备管理/网络测速/家长控制/应用商店），
          #     不依赖后端元数据，所以「该有的都有」。index.js MD5 feae5221c2b633088b8a5a7fcfc2b756，
          #     与官方 app-hub commit 45f666b60327afb742e1b460b174138c9f853930 逐字节一致。
          #   - 官方 app-hub main 现为 0.18.0，index.js 只剩 1438B 加载器，真正界面是 app.js；
          #     app.js 里 app 类卡片靠 /cgi-bin/luci/istore/home/v1/cards/ 元数据才显示，
          #     元数据缺就没卡片 —— 这正是之前首页卡片不齐的根因。
          #   - 官网固件后端 = quickstart 0.13.1，来自作者官方 linkease/istore-packages prebuilt，
          #     init 为 `serve --unix /var/run/quickstart/local.sock`（见官网固件 /etc/init.d/quickstart）。
          # 全部作者官方源，版本锁定；后期官方升级只改下面两个版本/哈希即可。
          ISTORE_QS_COMMIT="45f666b60327afb742e1b460b174138c9f853930"
          QS_BACKEND_VER="0.13.1"
          QS_BACKEND_HASH="f84ce3bfe1f6ee38338226cfdbb05283c6176cd75e5bb411c9411624f98ba0b1"

          # 前端：把官方 app-hub 切到 45f666b（浅克隆需补拉该 commit），再精确取 0.12.10-r1 包
          git -C "$ISTORE_HUB" fetch --depth=1 origin "$ISTORE_QS_COMMIT" 2>/dev/null || \
            git -C "$ISTORE_HUB" fetch --unshallow 2>/dev/null || :
          if ! git -C "$ISTORE_HUB" cat-file -e "$ISTORE_QS_COMMIT^{commit}" 2>/dev/null; then
            echo "ERROR: 官方 app-hub 缺少 45f666b 首页版本，无法照官网固件，终止构建"
            exit 1
          fi
          # 关掉 Windows Git 的换行符自动转换，确保 index.js 与官方源码逐字节一致
          git -C "$ISTORE_HUB" config core.autocrlf false
          git -C "$ISTORE_HUB" config core.eol lf
          git -C "$ISTORE_HUB" checkout -q "$ISTORE_QS_COMMIT" -- apps/quickstart/quickstart apps/quickstart/luci-app-quickstart
          FRONT_MK="$ISTORE_HUB/apps/quickstart/luci-app-quickstart/Makefile"
          if ! grep -q '^PKG_VERSION:=0.12.10-r1' "$FRONT_MK" 2>/dev/null; then
            echo "ERROR: 官方前端不是 0.12.10-r1（官网固件同款），终止构建"
            grep -E '^PKG_VERSION' "$FRONT_MK" 2>/dev/null || true
            exit 1
          fi
          # 前端 index.js 逐字节校验（必须等于官网固件里那份完整 5 卡片前端）
          FRONT_JS="$ISTORE_HUB/apps/quickstart/luci-app-quickstart/htdocs/luci-static/quickstart/index.js"
          FRONT_MD5=$(md5sum "$FRONT_JS" 2>/dev/null | cut -d' ' -f1)
          if [ "$FRONT_MD5" != "feae5221c2b633088b8a5a7fcfc2b756" ]; then
            echo "ERROR: 官方前端 index.js 与官网固件不一致（$FRONT_MD5），终止构建"
            exit 1
          fi

          # 后端：官方 app-hub 45f666b 的 Makefile 指向 0.13.0；官网固件实际是 0.13.1，
          # 这里把版本/源/hash 精确改成官方 istore-packages 0.13.1（哈希来自官方 release tarball）。
          QS_MK="$ISTORE_HUB/apps/quickstart/quickstart/Makefile"
          if ! grep -q 'PKG_SOURCE_URL:=https://github.com/linkease/istore-packages/releases/download/prebuilt/' "$QS_MK" 2>/dev/null; then
            echo "ERROR: 官方 quickstart Makefile 未指向作者官方 prebuilt 源，终止构建"
            exit 1
          fi
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$QS_BACKEND_VER/" "$QS_MK"
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$QS_BACKEND_HASH/" "$QS_MK"
          grep -q "^PKG_VERSION:=$QS_BACKEND_VER" "$QS_MK" && grep -q "^PKG_HASH:=$QS_BACKEND_HASH" "$QS_MK" || {
            echo "ERROR: 官方 quickstart 0.13.1 版本/哈希写入失败，终止构建"
            exit 1
          }
          echo "OK: 首页官网固件同款 — 前端 luci-app-quickstart 0.12.10-r1 (MD5 $FRONT_MD5) + 后端 quickstart $QS_BACKEND_VER (hash $QS_BACKEND_HASH)"

          # 首页两包在锁定版本后再拷贝（此时官方仓库已切到 45f666b、后端 Makefile 已改 0.13.1）
          copy_istore_pkg "$ISTORE_HUB/apps/quickstart/quickstart"          quickstart
          copy_istore_pkg "$ISTORE_HUB/apps/quickstart/luci-app-quickstart" luci-app-quickstart
          rm -rf "$ISTORE_HUB" "$ISTORE_LUCI"
          # ★Argon 主题：直接 clone 作者官方仓库（jerrykuku）master，编最新版 3.2.0。
          #   按作者 DEVELOPMENT.md 的官方做法，不用任何第三方 feed 的旧版/魔改版。
          #   先删 install -a 拉进来的软链，避免同名包冲突。
          rm -f package/feeds/luci/luci-theme-argon
          rm -rf package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          echo "=== Argon 官方版本确认（应为 3.2.0）==="
          grep -E '^PKG_VERSION|^PKG_RELEASE|^LUCI_BASENAME' package/luci-theme-argon/Makefile
          # ★Argon 3.2.0 三项固化（与 SBE1V1K / BE10000 的 Scripts/PRIVATE.sh 完全一致）：
          #   1) 一级菜单选中项白字；2) 主色 #6A89CC；3) 登录面板透明度 0.3。
          #   主题本体仍是 jerrykuku 官方 master 3.2.0 + 官方字体，仅这三项覆盖。
          ARGON_PKG="package/luci-theme-argon"
          ARGON_CSS="$ARGON_PKG/htdocs/luci-static/argon/css/base.css"
          ARGON_CONFIG="$ARGON_PKG/root/etc/config/argon"
          ARGON_DEFAULT="$ARGON_PKG/root/etc/uci-defaults/30_luci-theme-argon"
          # 1) 选中项强制白字（官方 base.css 给 #6A89CC 算出黑字）
          if [ -f "$ARGON_CSS" ] && ! grep -q "Argon selected white text" "$ARGON_CSS"; then
            cat >> "$ARGON_CSS" <<'ARGON_WHITE_TEXT_EOF'

          /* Argon selected white text (keep primary #6A89CC) */
          :root {
            --light-on-primary: #ffffff !important;
            --accent-text: #ffffff !important;
          }
          .main-left .nav > li > :is(a, button):first-child.active,
          .main-left .nav > li > :is(a, button):first-child.active::after,
          .main-left .nav > li > :is(a, button):first-child.active .menu-icon,
          .main-left .nav > li > :is(a, button):first-child:hover,
          .main-left .nav > li > :is(a, button):first-child:hover::after,
          .main-left .nav > li > :is(a, button):first-child:hover .menu-icon {
            color: #ffffff !important;
          }
          ARGON_WHITE_TEXT_EOF
            echo "Argon base.css: appended selected white-text override"
          fi
          # 2) 主色 #6A89CC（config + uci-defaults 两处）
          ARGON_PRIMARY='#6A89CC'
          if [ -f "$ARGON_CONFIG" ]; then
            sed -i "s/option primary '[^']*'/option primary '$ARGON_PRIMARY'/" "$ARGON_CONFIG"
            echo "Argon config primary: $(grep -m1 'option primary' "$ARGON_CONFIG" | tr -d '\t')"
          fi
          if [ -f "$ARGON_DEFAULT" ]; then
            sed -i "s/^primary #[0-9A-Fa-f]\{6\}$/primary $ARGON_PRIMARY/" "$ARGON_DEFAULT"
            echo "Argon uci-defaults primary: $(grep -m1 '^primary ' "$ARGON_DEFAULT")"
          fi
          # 3) 登录面板透明度 0.3（config + uci-defaults 两处，dark 继承）
          ARGON_TRANSPARENCY='0.3'
          if [ -f "$ARGON_CONFIG" ]; then
            sed -i "s/option transparency '[^']*'/option transparency '$ARGON_TRANSPARENCY'/" "$ARGON_CONFIG"
            echo "Argon config transparency: $(grep -m1 "option transparency '" "$ARGON_CONFIG" | tr -d '\t')"
          fi
          if [ -f "$ARGON_DEFAULT" ]; then
            sed -i "s/^transparency [0-9.]*$/transparency $ARGON_TRANSPARENCY/" "$ARGON_DEFAULT"
            echo "Argon uci-defaults transparency: $(grep -m1 '^transparency ' "$ARGON_DEFAULT")"
          fi
          # 注意：3.2.0 已把 argon-config 集成进主题，不装独立 luci-app-argon-config，
          # 否则 APK 会报 trying to overwrite ... owned by luci-theme-argon。
          # 分区扩容（sirpdboy）+ 磁盘管理器（sbwml）—— 用户指定，两者默认都在「系统」菜单
          ./scripts/feeds install luci-app-partexp luci-app-diskman
          # OpenClash：官方 luci feed 已随 install -a 就位，确认一下
          ls -d package/feeds/luci/luci-app-openclash >/dev/null 2>&1 && echo "OK      luci-app-openclash (official feed)" || echo "MISSING luci-app-openclash"
          # ★OAF 行为管理 / 应用过滤：clone 项目作者本人的官方仓库（destan19/OpenAppFilter）。
          #   不用镜像/打包仓（sbwml、lxhgxgl 等都不是作者源头）。
          #   仓库含三个包：luci-app-oaf(界面) + appfilter(用户态服务) + oaf→kmod-oaf(内核 netfilter 模块)。
          #   只勾 luci-app-oaf（见 Config/PONWRT-HG5585F.config），依赖链自动带出。
          #   当前目录是 wrt/（OpenWrt 源码树），clone 到 package/OpenAppFilter（作者官方推荐路径）。
          OAF_DIR="package/OpenAppFilter"
          rm -rf "$OAF_DIR"
          git clone --depth=1 --single-branch --branch master \
            "https://github.com/destan19/OpenAppFilter.git" "$OAF_DIR"
          echo "OAF commit: $(git -C "$OAF_DIR" rev-parse --short HEAD)"
          # ★关键：上游 immortalwrt/packages feed 自带一套 open-app-filter（也定义
          #   KernelPackage/oaf → kmod-oaf，标题 "open app filter kernel module"），
          #   与作者官方源这套（"OAF netfilter module"）符号重名 → Kconfig 递归依赖
          #   "symbol PACKAGE_kmod-oaf is selected by PACKAGE_kmod-oaf" → kmod-oaf
          #   选不中（#27 就是这么挂的）。必须先删掉 feed 里那套 + 旧 luci-app-appfilter，
          #   只保留作者官方源这一套；删 feeds 软链和源目录都删，避免 install -a 重现。
          for PKG in open-app-filter luci-app-appfilter; do
            rm -rf "package/feeds/packages/$PKG" "package/feeds/luci/$PKG" 2>/dev/null || :
            rm -rf "feeds/packages/net/$PKG" "feeds/luci/applications/$PKG" 2>/dev/null || :
          done
          echo "OK      已清除 feeds 里重复的 open-app-filter/luci-app-appfilter（避免 kmod-oaf 符号冲突）"
          # 硬失败校验：三个包 Makefile 必须都在；缺一个就中止，避免 defconfig 静默丢弃 OAF。
          for mk in luci-app-oaf/Makefile oaf/Makefile open-app-filter/Makefile; do
            [ -f "$OAF_DIR/$mk" ] || { echo "ERROR: OAF 官方包缺失 $mk，中止"; exit 1; }
          done
          # OAF 依赖 luci-lib-jsonc + luci-compat，必须在 luci feed 里就位，否则界面被丢弃。
          for dep in luci-lib-jsonc luci-compat; do
            if ls -d package/feeds/luci/"$dep" >/dev/null 2>&1; then echo "OK      OAF dep: $dep"; else echo "ERROR: OAF 依赖 $dep 不在 luci feed，中止"; exit 1; fi
          done
          echo "OK      OAF 三包 + 依赖全部就位（官方源 destan19/OpenAppFilter）"
          # 依赖校验：两插件的所有依赖必须全部就位，否则 make defconfig 会静默丢弃
          for p in luci-app-partexp luci-app-diskman fdisk block-mount bc blkid parted btrfs-progs losetup resize2fs e2fsprogs f2fs-tools kmod-loop lsblk ucode smartmontools wipefs dosfstools exfat-fsck exfat-mkfs swap-utils xfs-mkfs kmod-fs-exfat kmod-fs-f2fs kmod-fs-vfat kmod-fs-xfs; do
            if ls -d package/feeds/*/"$p" >/dev/null 2>&1; then echo "OK      $p"; else echo "MISSING $p"; fi
          done
          # ★主题默认值：LuCI collections 依赖 luci-theme-bootstrap，
          #   bootstrap 的 30 脚本按字母序在 argon 之后执行，会把默认主题抢回 bootstrap。
          #   把 collections 里的 bootstrap 换成 argon，bootstrap 不被拉进固件，
          #   argon 成为唯一默认主题（作者主题的 30_luci-theme-argon 会设 mediaurlbase）。
          find feeds/luci/collections -type f -name Makefile \
            -exec sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' {} +
          grep -rn "luci-theme" feeds/luci/collections/*/Makefile || true
          echo "=== 关键包是否就位 ==="
          for p in luci-base sqlite3-cli v2ray-geoip v2ray-geosite kmod-sched-bpf kmod-crypto-hw-eip93 honk luci-app-honk luci-app-store luci-app-istorex luci-app-quickstart quickstart taskd xz-utils tar; do
            if ls -d package/feeds/*/"$p" >/dev/null 2>&1 || ls -d package/"$p" >/dev/null 2>&1; then echo "OK      $p"; else echo "MISSING $p"; fi
          done
          # argon 是 clone 到 package/ 根下的官方仓库，单独确认
          [ -f package/luci-theme-argon/Makefile ] && echo "OK      luci-theme-argon (官方 clone $(grep -m1 '^PKG_VERSION' package/luci-theme-argon/Makefile))" || echo "MISSING luci-theme-argon"

      - name: Add HG5585F-only LuCI status plugins (NPU + PON optical)
        run: |
          cd wrt
          # ★这两个插件只对 Airoha / PON 机型有意义，SBE1V1K 与 BE10000 的入口不加。
          # 1) luci-app-airoha-npu：原作者 rchen14b 本人的官方仓，固定 commit，
          #    版本 1.0.1-r2，Apache-2.0，依赖 +luci-base @TARGET_airoha。
          NPU_COMMIT="561263eb624912cd427f3f4a09f3994a76f2ec6a"
          git clone --depth=1 --single-branch --branch main \
            "https://github.com/rchen14b/luci-app-airoha-npu.git" package/luci-app-airoha-npu
          git -C package/luci-app-airoha-npu fetch --depth=1 origin "$NPU_COMMIT" 2>/dev/null || :
          git -C package/luci-app-airoha-npu checkout -q "$NPU_COMMIT" || { echo "ERROR: luci-app-airoha-npu 官方 commit 缺失，中止"; exit 1; }
          grep -q '^PKG_VERSION:=1.0.1' package/luci-app-airoha-npu/Makefile || { echo "ERROR: luci-app-airoha-npu 版本异常，中止"; exit 1; }
          grep -q 'github.com/rchen14b/luci-app-airoha-npu' package/luci-app-airoha-npu/Makefile || { echo "ERROR: luci-app-airoha-npu 非原作者源，中止"; exit 1; }
          echo "OK      luci-app-airoha-npu 原作者版 $(git -C package/luci-app-airoha-npu rev-parse --short HEAD)"

          # 2) luci-app-pon-status：GitHub 上没有同名独立包，它是插件作者
          #    lunatickochiya 的 autoset 包里 autoset-uci-airoha 装的两份文件：
          #    70_pon.js（状态→概览的光模块卡片）+ rpcd ACL。这里只取这两份原文件，
          #    用我们仓库里的薄包装 Makefile 打包，不改插件源码，且逐字节校验作者原文件。
          #    不装整套 autoset：它的 zzz-autoset-airoha 会改 LAN IP/主机名/主题。
          PON_COMMIT="a0ac6ad4d0c986fa25ccbfdb4da4f6f276a39f9e"
          PON_SRC="https://raw.githubusercontent.com/lunatickochiya/Pon-Action/$PON_COMMIT/package/kochiya/autoset/files/generic"
          rm -rf package/luci-app-pon-status
          mkdir -p package/luci-app-pon-status/files
          cp -af "$GITHUB_WORKSPACE/package/luci-app-pon-status/Makefile" package/luci-app-pon-status/Makefile
          curl -fsSL "$PON_SRC/70_pon.js" -o package/luci-app-pon-status/files/70_pon.js || { echo "ERROR: 下载 70_pon.js 失败，中止"; exit 1; }
          curl -fsSL "$PON_SRC/luci-app-pon-status.json" -o package/luci-app-pon-status/files/luci-app-pon-status.json || { echo "ERROR: 下载 PON 状态 ACL 失败，中止"; exit 1; }
          printf '%s  %s\n' \
            'fe8e5956f1a801e92ffa49ac17919fe140d20b0c520c4f90b897a3aaa6c2fc03' 'package/luci-app-pon-status/files/70_pon.js' \
            '85a1127c38433f04d440d85cbe249cbc4f955f2762e30e78b9cd057d7263ca2a' 'package/luci-app-pon-status/files/luci-app-pon-status.json' \
            | sha256sum -c - || { echo "ERROR: PON 状态组件与作者原文件不一致，中止"; exit 1; }
          echo "OK      luci-app-pon-status 作者原文件（SHA256 已校验，未修改）"

          # 依赖确认（软检查）：PONWRT 上游 an7581.config 默认已选这些包，缺了状态页没数据源。
          # 真正的"是否被选中"由 defconfig 后的 .config 硬校验决定，这里只做提示，不中止。
          # 注意：airoha-pond 的包目录名是 airoha-pon-daemons（Makefile 里 define Package/airoha-pond），
          #       不能按包名找目录；kmod-airoha-xpon 在内核 target 里，也不在 pon_userspace feed。
          echo "=== Airoha-only 插件依赖（软检查）==="
          for p in luci-app-pon airoha-ponctl airoha-pond kmod-airoha-xpon; do
            d="$p"
            [ "$p" = "airoha-pond" ] && d="airoha-pon-daemons"
            if find feeds package/feeds -maxdepth 4 -type d -name "$d" 2>/dev/null | grep -q .; then
              echo "OK      $p (dir=$d)"
            else
              echo "WARN    未定位 $p (dir=$d)，交由 defconfig 校验"
            fi
          done

      - name: Overlay custom files (hostname + apk repos + honk)
        run: |
          mkdir -p wrt/files
          cp -af pon-files/. wrt/files/
          echo "overlay files: $(find wrt/files -type f | wc -l)"

          # ★根治 apk update 报 7 个 404 源错误：
          # base-files 的 Makefile 会把 distfeeds.list 打包进 base-files IPK，
          # 里面按每个 feed 拼一行 .../packages/<feed>/packages.adb，
          # 其中 video/pon_drivers/pon_userspace(上游) + honk/kenzok8/partexp/diskman(新增)
          # 这 7 个目录官方服务器 404，apk update 一访问就 wget exit 8、整体返回码 7，
          # iStore「刷新软件源/软件园更新」全崩。
          # 两道保险：
          #  (1) 文件：files overlay 提供空的 distfeeds.list（覆盖 base-files 自动生成版）
          #      + 补全的 customfeeds.list（6 个实测 HTTP 200 的真实源）；
          #  (2) 源头：patch base-files Makefile，生成时即 sed 删掉坏源行（双保险）。
          cd wrt
          BF_MAKEFILE=""
          for d in package/base-files package/system/base-files; do
            [ -f "$d/Makefile" ] && BF_MAKEFILE="$d/Makefile" && break
          done
          if [ -n "$BF_MAKEFILE" ]; then
            echo "patching $BF_MAKEFILE"
            # 在 FeedSourcesAppendAPK 之后插入删除坏源行的动作（awk 避免 sed 分隔符冲突）。
            if grep -q 'pon_drivers|pon_userspace|honk|kenzok8' "$BF_MAKEFILE"; then
              echo "already patched"
            else
              awk '/FeedSourcesAppendAPK.*distfeeds\.list/ && !d {print $0 "; sed -i -E '\''/\\/(video|pon_drivers|pon_userspace|honk|kenzok8|partexp|diskman)\\/packages\\.adb/d'\'' $(1)/etc/apk/repositories.d/distfeeds.list"; d=1; next} {print}' "$BF_MAKEFILE" > "$BF_MAKEFILE.tmp" && mv "$BF_MAKEFILE.tmp" "$BF_MAKEFILE"
              echo "patched"
            fi
            grep -n "distfeeds.list" "$BF_MAKEFILE" | head -5
          else
            echo "WARN: base-files Makefile not found, rely on files overlay only"
          fi

      - name: Configure
        run: |
          cd wrt
          # 完全沿用上游：configs/an7581.config + configs/release.config
          # 不做 sed 删设备、不手动指定 target —— 上游 an7581.config 里
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y 本来就是开的
          ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          cat ../Config/PONWRT-HG5585F.config >> .config
          make defconfig
          # ★诊断：抓取 defconfig 的递归依赖报错上下文（上一轮 luci-app-store 被丢弃的原因）
          if grep -q "recursive dependency" ../defconfig_probe.log 2>/dev/null; then :; fi
          echo "=== 递归依赖诊断 ==="
          make defconfig > ../defconfig.log 2>&1 || true
          grep -n "recursive dependency" ../defconfig.log || echo "(无递归依赖)"
          for L in $(grep -oE 'tmp/\.config-package\.in:[0-9]+' ../defconfig.log | cut -d: -f2 | sort -u | head -3); do
            echo "--- tmp/.config-package.in 第 $L 行上下文 ---"
            awk -v s=$((L-12)) -v e=$((L+12)) 'NR>=s && NR<=e {print NR": "$0}' tmp/.config-package.in
          done
          echo "=== iStore 三件套最终状态 ==="
          grep -E "CONFIG_PACKAGE_luci-app-(store|istorex|quickstart)=|^# CONFIG_PACKAGE_luci-app-(store|istorex|quickstart) " .config || echo "(符号不存在)"
          echo "=== 关键配置确认 ==="
          grep -E "DEVICE_fiberhome_hg5585f-ct=|DEBUG_INFO_BTF|PACKAGE_honk=|luci-app-honk=|luci-theme-argon=|crypto-hw-eip93=" .config || true
          echo "=== 增量包是否全部生效（被丢弃的会显示 MISSING）==="
          for p in honk luci-app-honk luci-app-store luci-app-istorex luci-app-quickstart quickstart taskd luci-lib-taskd luci-lib-xterm xz-utils tar libuci-lua mount-utils luci-theme-argon kmod-crypto-hw-eip93 zram-swap kmod-zram v2ray-geoip v2ray-geosite kmod-sched-bpf kmod-nft-queue; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   ${p}"; else echo "MISSING ${p}"; fi
          done
          # ★OAF 硬校验：核心三包必须在 defconfig 后真正选中，任缺其一立即中止，
          #   避免「clone 成功但被 Kconfig 静默丢弃」的假成功固件。
          echo "=== OAF 行为管理三包状态 ==="
          for p in luci-app-oaf appfilter kmod-oaf; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   OAF ${p}"; else echo "MISSING OAF ${p}"; echo "ERROR: OAF 核心包 ${p} 未被 defconfig 选中，中止"; exit 1; fi
          done
          # 中文包为软检查：luci.mk 按 zh_Hans 生成 luci-i18n-oaf-zh-cn，
          # 个别 luci.mk 版本命名可能有差异，缺了只警告不中止（OAF 本体功能不受影响）。
          if grep -q "^CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=y" .config; then echo "OK   OAF luci-i18n-oaf-zh-cn"; else echo "WARN OAF 中文 i18n 包未选中（本体功能不受影响）"; fi
          # ★Airoha-only 状态插件硬校验：clone 成功但被 Kconfig 静默丢弃同样算失败。
          echo "=== Airoha-only 状态插件（仅 HG5585F）==="
          for p in luci-app-airoha-npu luci-app-pon-status luci-app-pon airoha-ponctl; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then echo "OK   ${p}"; else echo "MISSING ${p}"; echo "ERROR: ${p} 未被 defconfig 选中，中止"; exit 1; fi
          done

      - name: Download package sources
        run: |
          cd wrt
          make download -j"$(nproc)" || true

      - name: Prebuild luci host tools (po2lmo / jsmin)
        run: |
          cd wrt
          # honk 的 luci-app-honk 不走标准 luci.mk，Build/Prepare 里直接裸调 po2lmo。
          # 正常情况：luci feed 存在 + 它声明了 luci-base/host 构建依赖，make 会自动编出 po2lmo。
          # 这里额外主动编一份放 staging_dir/host/bin，作为保险；失败只告警不中断。
          set +e
          LUCIBASE="feeds/luci/modules/luci-base"
          if [ ! -f "$LUCIBASE/src/po2lmo.c" ]; then
            LUCIBASE=$(dirname "$(dirname "$(find feeds -name po2lmo.c | head -1)")")
          fi
          echo "luci-base src: $LUCIBASE/src"
          if [ -f "$LUCIBASE/src/po2lmo.c" ]; then
            make -C "$LUCIBASE/src" clean po2lmo jsmin
            mkdir -p staging_dir/host/bin
            install -m 0755 "$LUCIBASE/src/po2lmo" staging_dir/host/bin/po2lmo
            if [ -x "$LUCIBASE/src/jsmin" ]; then
              install -m 0755 "$LUCIBASE/src/jsmin" staging_dir/host/bin/jsmin
            fi
          else
            echo "WARN: 未找到 po2lmo.c，交给 luci-base/host 构建依赖处理"
          fi
          echo "--- host 工具确认 ---"
          ls -la staging_dir/host/bin/ 2>/dev/null | grep -iE "po2lmo|jsmin" || echo "WARN: po2lmo 尚未生成（将由 luci-base/host 提供）"

      - name: Build firmware
        run: |
          cd wrt
          set -o pipefail
          if make -j"$(nproc)" V=s > ../build.log 2>&1; then
            echo "########## BUILD OK ##########"
            tail -n 40 ../build.log
          else
            echo "########## BUILD FAILED ##########"
            echo "--- 失败点（make 报错） ---"
            grep -n -E "make\[[0-9]+\]: \*\*\* .*Error [0-9]" ../build.log | tail -30
            echo "--- 具体 error 行 ---"
            grep -n -iE "^[^ ]*(error|Error)[: ]|error: |fatal error|undefined reference|No rule to make target" ../build.log | tail -40
            echo "--- 尾部 120 行 ---"
            tail -n 120 ../build.log
            echo "--- 失败包日志 ---"
            ls -t logs/ 2>/dev/null | head -10
            exit 1
          fi

      - name: Upload build log
        if: always()
        run: |
          if [ -f build.log ]; then gzip -9 -c build.log > build.log.gz; ls -la build.log.gz; fi

      - name: Save build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Collect artifacts
        run: |
          echo "=== iStoreOS 组件产物确认 ==="
          find wrt/bin/targets/airoha/an7581/packages -maxdepth 1 -type f \
            \( -iname "*istore*" -o -iname "*quickstart*" -o -iname "*taskd*" \) \
            -printf "%f\n" 2>/dev/null | sort | head -30 || true
          mkdir -p out
          # 上游配置会同时产出多个设备的镜像，这里只挑 HG5585F-CT 相关的
          find wrt/bin/targets/airoha/an7581 -maxdepth 1 -type f \
            \( -name "*hg5585f*" -o -name "sha256sums" -o -name "profiles.json" \) \
            -exec cp -v {} out/ \;
          echo "--- 产物 ---"
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5585f-ct-${{ env.UPSTREAM_COMMIT }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hg5585f-$(date +%y%m%d-%H%M)"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "PonWrt HG5585F-CT $TAG" \
            --notes "上游 pbs05/ponwrt@${{ env.UPSTREAM_COMMIT }} 原样编译；新增 honk(BTF)、EIP93 AES 加速、argon 主题（作者官方源 3.2.0，自带在线更新）+ iStoreOS 风格（iStore 商店 + istorex + QuickStart 首页 + 中文）、OpenClash、分区扩容、磁盘管理；主机名 HG5585F" \
            --prerelease
