name: IPQ95XX-BUILD

on:
  workflow_dispatch:

permissions: write-all

jobs:
  config:
    name: IPQ95XX
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ95XX
      WRT_THEME: argon
      # WRT_NAME = hostname，新版 Argon 取它渲染左上角/登录页品牌字（"头牌名"）
      WRT_NAME: BE10000
      # WRT_SSID = 默认 WiFi 名称，以 BE10000 打头（与品牌字保持一致）
      WRT_SSID: BE10000
      WRT_WORD: 12345678
      WRT_IP: 192.168.100.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ''
      WRT_TEST: false
