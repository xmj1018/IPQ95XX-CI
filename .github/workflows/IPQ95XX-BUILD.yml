name: IPQ95XX-BUILD

on:
  workflow_dispatch:

permissions: write-all

jobs:
  config:
    name: IPQ95XX-SBE1V1K
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ95XX
      WRT_THEME: argon
      # 机型参数：左上角名牌(WRT_NAME) 与无线名前缀(WRT_SSID) 必须一致。
      # 改无线名只有这一处：Scripts/Settings.sh 把 WRT_SSID 写进
      # /etc/config/router-tool 的 defaults.ssid，上游 default_ssid() 自动追加
      # -2.4G / -5.2G / -5.8G / -6G 后缀；user-files 不按机型硬写名称。
      WRT_NAME: SBE1V1K
      WRT_SSID: SBE1V1K
      WRT_WORD: 12345678
      WRT_IP: 192.168.99.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_TAG: SBE1V1K
      # 设备选择后置覆盖 Config/PRIVATE.txt；两个 IPQ95XX 机型共用同一份配置
      WRT_PACKAGE: |
        CONFIG_TARGET_DEVICE_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y
        CONFIG_TARGET_DEVICE_qualcommbe_ipq95xx_DEVICE_xiaomi_be10000=n
      WRT_TEST: false
