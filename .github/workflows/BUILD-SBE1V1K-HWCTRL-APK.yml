name: Build SBE1V1K 风扇控制 + RGB 状态灯 APK (11-23 原版大界面)

# 从用户确认的 11-23 09:16:58「最终版」固件逐字节提取的大界面方案打包：
#   1) luci-app-sbe1v1k-fan —— 「风扇控制」(order 95, view sbe1v1k/fan)
#   2) luci-app-sbe1v1k-led —— 「RGB 状态灯」(order 96, view sbe1v1k/led)
# 两包完全独立：菜单/ACL 文件名与内部 key 均不同，互不覆盖、互不依赖，
# 可单独 apk add 安装。view 用 30KB/27KB 大页面，不是 16:45 那套 26KB/25KB 小界面。
# 打包框架照搬已验证的 apk mkpkg(v3,ADBd) + 隔离 root 真实安装验证 + release 发布。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-v3:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    steps:
      - name: Install tools
        run: |
          apk add --no-cache --upgrade apk-tools bash tar gzip curl
          apk --version

      - uses: actions/checkout@v4

      - name: Verify apk >= 3.x
        run: |
          VER=$(apk --version | awk '{print $2}')
          MAJOR=${VER%%.*}
          [ "$MAJOR" -ge 3 ] || { echo "need apk-tools 3.x"; exit 1; }
          echo "apk 3.x ready: $VER"

      - name: Stage & build both APKs
        run: |
          set -eu
          WS="$GITHUB_WORKSPACE"
          OUT="$WS/dist"; mkdir -p "$OUT"
          SRC="$WS/user-files"
          DEF="$WS/hwctrl-apk"

          mkpkg() {
            # $1=pkg-name  $2=version  $3=description  $4=staging-dir
            NAME="$1"; VER="$2"; DESC="$3"; ST="$4"
            case "$NAME" in
              *-fan) DAEMON=fanctl ;;
              *-led) DAEMON=ledctl ;;
              *) echo "unknown daemon for $NAME"; exit 1 ;;
            esac
            printf '%s\n' \
              '#!/bin/sh' \
              '# 由 APK 安装后触发：让本套服务立即可用，只启停本包守护' \
              'rm -f /tmp/luci-indexcache* 2>/dev/null || true' \
              'rm -rf /tmp/luci-modulecache 2>/dev/null || true' \
              "chmod +x /usr/sbin/$DAEMON /etc/init.d/$DAEMON 2>/dev/null || true" \
              "/etc/init.d/$DAEMON enable >/dev/null 2>&1 || true" \
              "/etc/init.d/$DAEMON start  >/dev/null 2>&1 || true" \
              '/etc/init.d/rpcd restart   >/dev/null 2>&1 || true' \
              '/etc/init.d/uhttpd restart >/dev/null 2>&1 || true' \
              'exit 0' > "$ST/scripts/post-install"
            chmod 755 "$ST/scripts/post-install"
            apk mkpkg --xattrs=no \
              --info "name:$NAME" \
              --info "version:$VER" \
              --info "description:$DESC" \
              --info "arch:noarch" \
              --info "license:MIT" \
              --info "origin:sbe1v1k-hwctrl-bigui" \
              --info "maintainer:xmj1018" \
              --script "post-install:$ST/scripts/post-install" \
              --script "post-upgrade:$ST/scripts/post-install" \
              --files "$ST/data" \
              --output "$OUT/${NAME}-${VER}.apk"
            echo "built $OUT/${NAME}-${VER}.apk"
          }

          # ---------- 包1：风扇控制（11-23 大界面 fan.js 30612B） ----------
          FAN="$WS/.stage-fan"; rm -rf "$FAN"
          mkdir -p "$FAN/data/etc/init.d" "$FAN/data/etc/config" \
                   "$FAN/data/usr/sbin" "$FAN/data/usr/lib/sbe1v1k" \
                   "$FAN/data/usr/share/luci/menu.d" "$FAN/data/usr/share/rpcd/acl.d" \
                   "$FAN/data/www/luci-static/resources/view/sbe1v1k" "$FAN/scripts"
          # 后端/配置/init：11-23 固件逐字节原样
          cp -af "$SRC/etc/init.d/fanctl"          "$FAN/data/etc/init.d/fanctl"
          cp -af "$SRC/etc/config/fan"             "$FAN/data/etc/config/fan"
          cp -af "$SRC/usr/sbin/fanctl"            "$FAN/data/usr/sbin/fanctl"
          cp -af "$SRC/usr/lib/sbe1v1k/fanctl"     "$FAN/data/usr/lib/sbe1v1k/fanctl"
          cp -af "$SRC/usr/lib/sbe1v1k/init.fanctl" "$FAN/data/usr/lib/sbe1v1k/init.fanctl"
          cp -af "$SRC/usr/lib/sbe1v1k/config.fan" "$FAN/data/usr/lib/sbe1v1k/config.fan"
          # 大界面 view（不是 system/fan.js 小界面）
          cp -af "$SRC/www/luci-static/resources/view/sbe1v1k/fan.js" \
                 "$FAN/data/www/luci-static/resources/view/sbe1v1k/fan.js"
          # 拆分后的独立菜单/ACL
          cp -af "$DEF/fan/menu.d/luci-app-sbe1v1k-fan.json" \
                 "$FAN/data/usr/share/luci/menu.d/luci-app-sbe1v1k-fan.json"
          cp -af "$DEF/fan/acl.d/luci-app-sbe1v1k-fan.json" \
                 "$FAN/data/usr/share/rpcd/acl.d/luci-app-sbe1v1k-fan.json"
          chmod 755 "$FAN/data/etc/init.d/fanctl" "$FAN/data/usr/sbin/fanctl"
          chown -R 0:0 "$FAN"

          # ---------- 包2：RGB 状态灯（11-23 大界面 led.js 27380B） ----------
          LED="$WS/.stage-led"; rm -rf "$LED"
          mkdir -p "$LED/data/etc/init.d" "$LED/data/etc/config" \
                   "$LED/data/usr/sbin" "$LED/data/usr/lib/sbe1v1k" \
                   "$LED/data/usr/share/luci/menu.d" "$LED/data/usr/share/rpcd/acl.d" \
                   "$LED/data/www/luci-static/resources/view/sbe1v1k" "$LED/scripts"
          cp -af "$SRC/etc/init.d/ledctl"          "$LED/data/etc/init.d/ledctl"
          cp -af "$SRC/etc/config/led"             "$LED/data/etc/config/led"
          cp -af "$SRC/usr/sbin/ledctl"            "$LED/data/usr/sbin/ledctl"
          cp -af "$SRC/usr/lib/sbe1v1k/ledctl"     "$LED/data/usr/lib/sbe1v1k/ledctl"
          cp -af "$SRC/usr/lib/sbe1v1k/init.ledctl" "$LED/data/usr/lib/sbe1v1k/init.ledctl"
          cp -af "$SRC/usr/lib/sbe1v1k/config.led" "$LED/data/usr/lib/sbe1v1k/config.led"
          cp -af "$SRC/www/luci-static/resources/view/sbe1v1k/led.js" \
                 "$LED/data/www/luci-static/resources/view/sbe1v1k/led.js"
          cp -af "$DEF/led/menu.d/luci-app-sbe1v1k-led.json" \
                 "$LED/data/usr/share/luci/menu.d/luci-app-sbe1v1k-led.json"
          cp -af "$DEF/led/acl.d/luci-app-sbe1v1k-led.json" \
                 "$LED/data/usr/share/rpcd/acl.d/luci-app-sbe1v1k-led.json"
          chmod 755 "$LED/data/etc/init.d/ledctl" "$LED/data/usr/sbin/ledctl"
          chown -R 0:0 "$LED"

          VER="2.0-r20261126"
          mkpkg "luci-app-sbe1v1k-fan" "$VER" "SBE1V1K Fan Control (11-23 big UI, fanctl)" "$FAN"
          mkpkg "luci-app-sbe1v1k-led" "$VER" "SBE1V1K RGB Status LED (11-23 big UI, ledctl)" "$LED"

          echo "=== APK magic (ADBd = v3) ==="
          for f in "$OUT"/*.apk; do echo -n "$(basename "$f"): "; od -An -c -N4 "$f"; done
          ls -lh "$OUT"/*.apk

      - name: Verify - separate installs + content asserts
        run: |
          set -eu
          WS="$GITHUB_WORKSPACE"
          FAN=$(ls "$WS"/dist/luci-app-sbe1v1k-fan-*.apk)
          LED=$(ls "$WS"/dist/luci-app-sbe1v1k-led-*.apk)

          echo "=== 1) 风扇包单独安装到隔离 root ==="
          rm -rf /tmp/apkfan; mkdir -p /tmp/apkfan/tmp
          apk add --root /tmp/apkfan --initdb --no-scripts --allow-untrusted "$FAN"
          [ -f /tmp/apkfan/etc/init.d/fanctl ]
          [ -f /tmp/apkfan/etc/config/fan ]
          [ -f /tmp/apkfan/usr/sbin/fanctl ]
          [ -f /tmp/apkfan/usr/lib/sbe1v1k/fanctl ]
          [ -f /tmp/apkfan/usr/share/luci/menu.d/luci-app-sbe1v1k-fan.json ]
          [ -f /tmp/apkfan/usr/share/rpcd/acl.d/luci-app-sbe1v1k-fan.json ]
          [ -f /tmp/apkfan/www/luci-static/resources/view/sbe1v1k/fan.js ]
          [ "$(stat -c%s /tmp/apkfan/www/luci-static/resources/view/sbe1v1k/fan.js)" = "30612" ]
          grep -q '"title": "风扇控制"' /tmp/apkfan/usr/share/luci/menu.d/luci-app-sbe1v1k-fan.json
          grep -q '"path": "sbe1v1k/fan"' /tmp/apkfan/usr/share/luci/menu.d/luci-app-sbe1v1k-fan.json
          grep -q '/usr/sbin/fanctl' /tmp/apkfan/usr/share/rpcd/acl.d/luci-app-sbe1v1k-fan.json
          echo "OK: 风扇包独立齐全，view=30612B 大界面，菜单=风扇控制"

          echo "=== 2) RGB 包单独安装到隔离 root ==="
          rm -rf /tmp/apkled; mkdir -p /tmp/apkled/tmp
          apk add --root /tmp/apkled --initdb --no-scripts --allow-untrusted "$LED"
          [ -f /tmp/apkled/etc/init.d/ledctl ]
          [ -f /tmp/apkled/etc/config/led ]
          [ -f /tmp/apkled/usr/sbin/ledctl ]
          [ -f /tmp/apkled/usr/lib/sbe1v1k/ledctl ]
          [ -f /tmp/apkled/usr/share/luci/menu.d/luci-app-sbe1v1k-led.json ]
          [ -f /tmp/apkled/usr/share/rpcd/acl.d/luci-app-sbe1v1k-led.json ]
          [ -f /tmp/apkled/www/luci-static/resources/view/sbe1v1k/led.js ]
          [ "$(stat -c%s /tmp/apkled/www/luci-static/resources/view/sbe1v1k/led.js)" = "27380" ]
          grep -q '"title": "RGB 状态灯"' /tmp/apkled/usr/share/luci/menu.d/luci-app-sbe1v1k-led.json
          grep -q '"path": "sbe1v1k/led"' /tmp/apkled/usr/share/luci/menu.d/luci-app-sbe1v1k-led.json
          grep -q '/usr/sbin/ledctl' /tmp/apkled/usr/share/rpcd/acl.d/luci-app-sbe1v1k-led.json
          echo "OK: RGB 包独立齐全，view=27380B 大界面，菜单=RGB 状态灯"

          echo "=== 3) 两包互不串味 ==="
          [ ! -e /tmp/apkfan/www/luci-static/resources/view/sbe1v1k/led.js ]
          [ ! -e /tmp/apkfan/usr/sbin/ledctl ]
          [ ! -e /tmp/apkfan/usr/share/luci/menu.d/luci-app-sbe1v1k-led.json ]
          [ ! -e /tmp/apkled/www/luci-static/resources/view/sbe1v1k/fan.js ]
          [ ! -e /tmp/apkled/usr/sbin/fanctl ]
          [ ! -e /tmp/apkled/usr/share/luci/menu.d/luci-app-sbe1v1k-fan.json ]
          [ ! -e /tmp/apkfan/www/luci-static/resources/view/system/fan.js ]
          [ ! -e /tmp/apkled/www/luci-static/resources/view/system/led.js ]
          [ ! -e /tmp/apkfan/usr/share/luci/menu.d/luci-app-fan.json ]
          [ ! -e /tmp/apkled/usr/share/luci/menu.d/luci-app-led.json ]
          echo "OK: 无对方文件、无 16:45 小界面残留、无合并 sbe1v1k.json"

          echo "=== 安装后文件清单 ==="; find /tmp/apkfan /tmp/apkled -type f | sort
          echo "INSTALL + CONTENT VERIFY PASS"

      - name: Publish release (two APKs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          TAG="sbe1v1k-hwctrl-bigui-apk"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          JSONH="Accept: application/vnd.github+json"
          curl -s -X DELETE -H "$AUTH" -H "$JSONH" "$API/releases/tags/$TAG" >/dev/null || true
          curl -s -X DELETE -H "$AUTH" -H "$JSONH" "$API/git/refs/tags/$TAG" >/dev/null || true
          BODY="从 11-23 09:16:58 原版固件逐字节提取的大界面：风扇控制(order 95, sbe1v1k/fan.js 30KB) + RGB 状态灯(order 96, sbe1v1k/led.js 27KB)。两个独立 APK，可单独 apk add 安装、互不依赖；后端 fanctl/ledctl 与原版一致。已通过 apk v3(ADBd) 真实隔离安装 + 内容断言。"
          REL=$(curl -s -X POST -H "$AUTH" -H "$JSONH" -H "Content-Type: application/json" "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"SBE1V1K 风扇控制 + RGB 状态灯 APK（11-23 原版大界面）\",\"body\":\"$BODY\",\"target_commitish\":\"$GITHUB_SHA\",\"draft\":false,\"prerelease\":false}")
          UPLOAD_URL=$(printf '%s' "$REL" | sed -n 's/.*"upload_url": "\([^"]*\)".*/\1/p' | sed 's/{?name,label}//')
          [ -n "$UPLOAD_URL" ] || { echo "release 失败: $REL"; exit 1; }
          for f in "$GITHUB_WORKSPACE"/dist/*.apk; do
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/vnd.alpine.linux.apk" \
                 --data-binary "@$f" "$UPLOAD_URL?name=$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          echo "=== 已发布 ==="
          curl -s -H "$AUTH" -H "$JSONH" "$API/releases/tags/$TAG" | grep -oE '"browser_download_url": "[^"]+\.apk"'
