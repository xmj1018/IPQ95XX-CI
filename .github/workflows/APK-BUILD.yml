name: APK-BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build apk v3 packages in Alpine 3.23 (apk-tools 3.x)
        run: |
          docker run --rm -v "$PWD/apkgenerator:/work" alpine:3.23 sh /work/build.sh

      - name: List generated packages
        run: ls -la apkgenerator/out/

      - name: Upload apk packages
        uses: actions/upload-artifact@v4
        with:
          name: apk-v3-packages
          path: apkgenerator/out/*.apk
          if-no-files-found: error
