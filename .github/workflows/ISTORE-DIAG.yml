name: ISTORE-DIAG

on:
  workflow_dispatch:

permissions: write-all

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install minimal build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 perl git curl file cpio unzip gawk gettext libncurses-dev zlib1g-dev

      - name: Clone PonWrt and prepare feeds
        run: |
          git clone --depth=1 --single-branch --branch master https://github.com/pbs05/ponwrt.git wrt
          cd wrt
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "src-git honk https://github.com/kenzok8/openwrt-honk.git" >> feeds.conf
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf
          echo "src-git partexp https://github.com/sirpdboy/luci-app-partexp.git" >> feeds.conf
          echo "src-git diskman https://github.com/sbwml/luci-app-diskman.git" >> feeds.conf
          ./scripts/feeds update honk kenzok8 partexp diskman
          ./scripts/feeds install luci-app-store luci-app-istorex luci-app-quickstart quickstart taskd luci-lib-taskd luci-lib-xterm
          ./scripts/feeds install honk luci-app-honk luci-app-partexp luci-app-diskman luci-app-argon-config

      - name: Dump BEFORE state
        run: |
          cd wrt
          ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          cat ../Config/PONWRT-HG5585F.config >> .config
          make defconfig > /dev/null 2>&1 || true
          echo "===== BEFORE: tmp/.config-package.in matches ====="
          grep -n -E "config PACKAGE_luci-app-(store|istorex|quickstart)|depends on.*luci-app-store|select PACKAGE_luci-app-store" tmp/.config-package.in | head -60 || echo "(no match)"
          echo "===== BEFORE: store Kconfig context ====="
          grep -n -A 14 -B 3 "config PACKAGE_luci-app-store" tmp/.config-package.in | head -40 || echo "(no match)"
          echo "===== BEFORE: quickstart Kconfig context ====="
          grep -n -A 14 -B 3 "config PACKAGE_luci-app-quickstart" tmp/.config-package.in | head -40 || echo "(no match)"
          echo "===== BEFORE: .config matches ====="
          grep -n -E "CONFIG_PACKAGE_luci-app-(store|istorex|quickstart)" .config || echo "(no symbol)"
          echo "===== BEFORE: .config luci-app sample ====="
          grep -n "CONFIG_PACKAGE_luci-app" .config | head -30 || echo "(none)"
          echo "===== BEFORE: store Makefile ====="
          cat package/feeds/kenzok8/luci-app-store/Makefile

      - name: Patch experimental and dump AFTER
        run: |
          cd wrt
          for f in luci-app-store luci-app-istorex luci-app-quickstart luci-lib-taskd; do
            p="package/feeds/kenzok8/$f/Makefile"
            [ -f "$p" ] || continue
            sed -i '/^LUCI_EXTRA_DEPENDS:=/d' "$p"
            sed -i 's/^PKG_RELEASE:=$/PKG_RELEASE:=1/' "$p"
          done
          echo "===== PATCHED Makefile heads ====="
          for f in luci-app-store luci-app-istorex luci-app-quickstart; do
            echo "--- $f ---"
            grep -n -E "LUCI_DEPENDS|LUCI_EXTRA_DEPENDS|PKG_VERSION|PKG_RELEASE|include .*luci.mk" "package/feeds/kenzok8/$f/Makefile"
          done
          rm -f tmp/.config-package.in .config
          ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          cat ../Config/PONWRT-HG5585F.config >> .config
          make defconfig > /dev/null 2>&1 || true
          echo "===== AFTER: tmp/.config-package.in matches ====="
          grep -n -E "config PACKAGE_luci-app-(store|istorex|quickstart)|depends on.*luci-app-store|select PACKAGE_luci-app-store" tmp/.config-package.in | head -60 || echo "(no match)"
          echo "===== AFTER: .config matches ====="
          grep -n -E "CONFIG_PACKAGE_luci-app-(store|istorex|quickstart)" .config || echo "(no symbol)"

      - name: Dump defconfig warnings
        if: always()
        run: |
          cd wrt
          make defconfig > ../diag_defconfig.log 2>&1 || true
          echo "===== warnings mentioning store/istore/quickstart ====="
          grep -iE "store|istore|quickstart" ../diag_defconfig.log | head -80 || echo "(none)"
          echo "===== all WARNING lines (first 40) ====="
          grep "WARNING" ../diag_defconfig.log | head -40 || echo "(none)"
