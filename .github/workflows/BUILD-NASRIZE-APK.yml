name: Build nasresize APK v3

# 分区扩容(魔改 luci-app-partexp)：把自写后端 + 界面覆盖到固件自带的
# luci-app-partexp 上。菜单保持原位 admin/system/partexp (order 54, 名字"分区扩容")，
# 点开后跑我们的 /usr/sbin/nasresize 扩容/减容/拔盘逻辑。
# 只打包纯脚本为标准 APK v3 (apk-tools mkpkg)，不编译固件、不碰任何 Config/。
# 生成的 .apk 作为独立 release asset 发布 (tag: nasresize-apk-v3)。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-v3:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    steps:
      # alpine:edge 自带 apk-tools 3.x。
      - name: Install tools
        run: |
          apk add --no-cache --upgrade apk-tools git bash tar gzip curl
          apk --version
          curl --version | head -1

      - uses: actions/checkout@v4

      - name: Verify apk mkpkg >= 3.x
        run: |
          VER=$(apk --version | awk '{print $2}')
          MAJOR=${VER%%.*}
          echo "apk-tools major=$MAJOR"
          [ "$MAJOR" -ge 3 ] || { echo "need apk-tools 3.x for mkpkg --info"; exit 1; }
          echo "apk tools 3.x ready"

      - name: Stage package data tree
        run: |
          set -eu
          STAGE="$GITHUB_WORKSPACE/.apkstage"
          DATA="$STAGE/data"
          SCRIPTS="$STAGE/scripts"
          SRC="$GITHUB_WORKSPACE/tools/nasresize-apk/src"
          rm -rf "$STAGE"
          mkdir -p "$DATA" "$SCRIPTS"

          # --- 自有文件（不与原固件包冲突）---
          mkdir -p "$DATA/usr/sbin" "$DATA/etc/config" "$DATA/etc/uci-defaults" \
                   "$DATA/usr/share/rpcd/acl.d" "$DATA/usr/share/nasresize/payload"
          cp -f "$SRC/usr/sbin/nasresize"           "$DATA/usr/sbin/nasresize"
          cp -f "$SRC/etc/config/nasresize"         "$DATA/etc/config/nasresize"
          cp -f "$SRC/etc/uci-defaults/99-nasresize" "$DATA/etc/uci-defaults/99-nasresize"
          cp -f "$SRC/usr/share/rpcd/acl.d/luci-app-nasresize.json" \
                "$DATA/usr/share/rpcd/acl.d/luci-app-nasresize.json"

          # --- 魔改 payload：装后由 post-install 覆盖到 partexp，避免 apk 文件归属冲突 ---
          P="$DATA/usr/share/nasresize/payload"
          cp -f "$SRC/usr/share/nasresize/payload/luci-app-partexp.json"      "$P/menu.json"
          cp -f "$SRC/usr/share/nasresize/payload/luci-app-partexp.acl.json"  "$P/acl.json"
          cp -f "$SRC/usr/share/nasresize/payload/partexp.view.js"            "$P/view.js"

          chown -R 0:0 "$DATA" "$SCRIPTS"

          # conffiles: 升级时保留配置
          mkdir -p "$DATA/lib/apk/packages"
          printf '%s\n' '/etc/config/nasresize' > "$DATA/lib/apk/packages/luci-app-partexp-nasresize.conffiles"
          ( cd "$DATA" && find . \( -type f -o -type l \) | sed 's|^\./|/|' | sort > "lib/apk/packages/luci-app-partexp-nasresize.list" )

          # 生命周期脚本：post-install 里做 partexp 覆盖 + 清掉旧的 nasresize 菜单
          cat > "$SCRIPTS/post-install" <<'SCRIPT'
          #!/bin/sh
          chmod 755 /usr/sbin/nasresize 2>/dev/null || true
          chmod 755 /etc/uci-defaults/99-nasresize 2>/dev/null || true
          mkdir -p /var/log /var/lock /mnt 2>/dev/null || true

          P=/usr/share/nasresize/payload

          # 1) 魔改 partexp：菜单保持 admin/system/partexp / order 54 / 名字"分区扩容"
          [ -f "$P/menu.json" ] && cp -f "$P/menu.json" /usr/share/luci/menu.d/luci-app-partexp.json 2>/dev/null || true
          # 2) ACL 保持 luci-app-partexp（已含 file.exec），确保后端调用被授权
          [ -f "$P/acl.json" ] && cp -f "$P/acl.json" /usr/share/rpcd/acl.d/luci-app-partexp.json 2>/dev/null || true
          # 3) 用我们的 view 覆盖 partexp 界面（探测所有可能的 luci-static 根）
          for R in /www/luci-static /usr/share/luci-static /usr/lib/luci-static; do
            [ -d "$R/resources" ] || continue
            [ -f "$P/view.js" ] || continue
            cp -f "$P/view.js" "$R/resources/view/partexp.js" 2>/dev/null || true
            mkdir -p "$R/resources/view/partexp" 2>/dev/null || true
            cp -f "$P/view.js" "$R/resources/view/partexp/index.js" 2>/dev/null || true
          done

          # 4) 清掉旧版(此前 order 97)新建的 nasresize 菜单与 view，避免系统里多出一项
          rm -f /usr/share/luci/menu.d/luci-app-nasresize.json 2>/dev/null || true
          for R in /www/luci-static /usr/share/luci-static /usr/lib/luci-static; do
            rm -f "$R/resources/view/nasresize.js" 2>/dev/null || true
            rm -rf "$R/resources/view/nasresize" 2>/dev/null || true
          done

          # 5) 清缓存、重启服务
          rm -f /tmp/luci-indexcache* 2>/dev/null || true
          rm -rf /tmp/luci-modulecache 2>/dev/null || true
          killall -HUP rpcd 2>/dev/null || true
          /etc/init.d/rpcd restart >/dev/null 2>&1 || true
          exit 0
          SCRIPT
          cp "$SCRIPTS/post-install" "$SCRIPTS/post-upgrade"
          cat > "$SCRIPTS/post-deinstall" <<'SCRIPT'
          #!/bin/sh
          # 卸载时把固件自带 partexp 的菜单/ACL 交还（重装修复；view 需恢复固件原版）
          rm -f /usr/share/luci/menu.d/luci-app-nasresize.json 2>/dev/null || true
          rm -f /tmp/luci-indexcache* 2>/dev/null || true
          rm -rf /tmp/luci-modulecache 2>/dev/null || true
          killall -HUP rpcd 2>/dev/null || true
          exit 0
          SCRIPT
          chmod 755 "$SCRIPTS"/*

          echo "$STAGE" > "$GITHUB_WORKSPACE/.apkstage_path"

      - name: Build APK v3 with official apk mkpkg
        run: |
          set -eu
          STAGE=$(cat "$GITHUB_WORKSPACE/.apkstage_path")
          DATA="$STAGE/data"
          SCRIPTS="$STAGE/scripts"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          NAME="luci-app-partexp-nasresize"
          VER="2.0-r1"
          DESC="LuCI 分区扩容 (magisk on luci-app-partexp): lossless overlay expand/reduce"
          apk mkpkg \
            --xattrs=no \
            --info "name:$NAME" \
            --info "version:$VER" \
            --info "description:$DESC" \
            --info "arch:noarch" \
            --info "license:MIT" \
            --info "origin:custom" \
            --info "maintainer:WorkBuddy" \
            --script "post-install:$SCRIPTS/post-install" \
            --script "post-upgrade:$SCRIPTS/post-upgrade" \
            --script "post-deinstall:$SCRIPTS/post-deinstall" \
            --files "$DATA" \
            --output "$OUT/${NAME}-${VER}.apk"
          ls -lh "$OUT"/*.apk
          echo "APK_PATH=$OUT/${NAME}-${VER}.apk" >> "$GITHUB_ENV"

      - name: Verify package installs with apk v3 (real install test)
        run: |
          set -eu
          APK=$(ls "$GITHUB_WORKSPACE"/dist/*.apk)
          echo "=== 包格式头 (ADBD = apk v3 原生格式) ==="
          od -An -tx1 -N 8 "$APK"
          echo "=== 真实安装到隔离 root ==="
          rm -rf /tmp/apkroot; mkdir -p /tmp/apkroot
          apk add --root /tmp/apkroot --initdb --no-scripts --allow-untrusted "$APK"
          echo "=== 安装后文件核对 ==="
          find /tmp/apkroot -type f | sort
          echo "=== 关键文件断言 ==="
          for f in \
            /tmp/apkroot/usr/sbin/nasresize \
            /tmp/apkroot/etc/config/nasresize \
            /tmp/apkroot/etc/uci-defaults/99-nasresize \
            /tmp/apkroot/usr/share/rpcd/acl.d/luci-app-nasresize.json \
            /tmp/apkroot/usr/share/nasresize/payload/menu.json \
            /tmp/apkroot/usr/share/nasresize/payload/acl.json \
            /tmp/apkroot/usr/share/nasresize/payload/view.js; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; exit 1; fi
          done
          echo "=== 断言 post-install 脚本含 partexp 覆盖与旧菜单清理 ==="
          STAGE=$(cat "$GITHUB_WORKSPACE/.apkstage_path")
          grep -q 'menu.d/luci-app-partexp.json' "$STAGE/scripts/post-install"
          grep -q 'view/partexp.js' "$STAGE/scripts/post-install"
          grep -q 'luci-app-nasresize.json' "$STAGE/scripts/post-install"
          echo "INSTALL TEST PASS: apk v3 可安装，payload 齐全，partexp 覆盖逻辑就位"

      - name: Publish release asset (GitHub REST API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          TAG="nasresize-apk-v3"
          APK=$(ls "$GITHUB_WORKSPACE"/dist/*.apk)
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          JSONH="Accept: application/vnd.github+json"
          OLD_ID=$(curl -s -H "$AUTH" -H "$JSONH" "$API/releases/tags/$TAG" \
                    | sed -n 's/.*"id": \([0-9]*\).*/\1/p' | head -1)
          if [ -n "$OLD_ID" ]; then
            curl -s -X DELETE -H "$AUTH" -H "$JSONH" "$API/releases/$OLD_ID" >/dev/null || true
          fi
          curl -s -X DELETE -H "$AUTH" -H "$JSONH" "$API/git/refs/tags/$TAG" >/dev/null || true
          REL=$(curl -s -X POST -H "$AUTH" -H "$JSONH" -H "Content-Type: application/json" \
                "$API/releases" \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"分区扩容 APK (魔改 luci-app-partexp, 原位 order 54)\",\"body\":\"安装后覆盖固件自带『分区扩容』(luci-app-partexp)，菜单位置与名字不变。支持无损扩容/减容/拔盘。三机型通用。\",\"target_commitish\":\"$GITHUB_SHA\",\"draft\":false,\"prerelease\":false}")
          UPLOAD_URL=$(printf '%s' "$REL" | sed -n 's/.*"upload_url": "\([^"]*\)".*/\1/p' | sed 's/{?name,label}//')
          echo "upload_url=$UPLOAD_URL"
          [ -n "$UPLOAD_URL" ] || { echo "创建 release 失败: $REL"; exit 1; }
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/vnd.alpine.linux.apk" \
               --data-binary "@$APK" "$UPLOAD_URL?name=$(basename "$APK")" >/dev/null
          echo "=== release 已发布 ==="
          curl -s -H "$AUTH" -H "$JSONH" "$API/releases/tags/$TAG" \
            | grep -oE '"browser_download_url": "[^"]+\.apk"' | head -1
