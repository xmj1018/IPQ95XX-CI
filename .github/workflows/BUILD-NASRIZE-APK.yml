name: Build 分区扩容 官方原版 APK (插件包 + 中文包)

# 照搬 sirpdboy/luci-app-partexp 官方 v2.0.5 的两个原版包：
#   1) luci-app-partexp        —— 插件本体（view/rpcd 后端/ACL/menu，原样不改）
#   2) luci-i18n-partexp-zh-cn —— 独立中文包（partexp.zh-cn.lmo，原样不改）
# 关键：用【官方原名 + 更高版本】做升级替换，避免与固件自带同名包冲突被拒绝；
#       绝不魔改 view/ACL（此前自定义 view + 独立包名导致 apk 拒绝安装 + load error）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-v3:
    runs-on: ubuntu-latest
    container:
      image: alpine:edge
    steps:
      - name: Install tools
        run: |
          apk add --no-cache --upgrade apk-tools bash tar gzip curl
          apk --version

      - uses: actions/checkout@v4

      - name: Verify apk >= 3.x
        run: |
          VER=$(apk --version | awk '{print $2}')
          MAJOR=${VER%%.*}
          [ "$MAJOR" -ge 3 ] || { echo "need apk-tools 3.x"; exit 1; }
          echo "apk 3.x ready"

      - name: Stage & build both official APKs
        run: |
          set -eu
          WS="$GITHUB_WORKSPACE"
          OUT="$WS/dist"; mkdir -p "$OUT"
          BASE="$WS/tools/partexp-official"

          mkpkg() {
            # $1=stage_dir  $2=name  $3=version  $4=desc
            SD="$1"; NAME="$2"; VER="$3"; DESC="$4"
            ST="$WS/.stage-$NAME"; rm -rf "$ST"; mkdir -p "$ST/data" "$ST/scripts"
            cp -af "$SD"/. "$ST/data/"
            chown -R 0:0 "$ST"
            # 官方原包无脚本；留空 post 脚本仅清 LuCI 缓存（升级后需重载）
            cat > "$ST/scripts/post-install" <<'EOF'
            #!/bin/sh
            rm -f /tmp/luci-indexcache* 2>/dev/null || true
            rm -rf /tmp/luci-modulecache 2>/dev/null || true
            killall -HUP rpcd 2>/dev/null || true
            /etc/init.d/rpcd restart >/dev/null 2>&1 || true
            /etc/init.d/uhttpd restart >/dev/null 2>&1 || true
            exit 0
            EOF
            chmod 755 "$ST/scripts/post-install"
            apk mkpkg --xattrs=no \
              --info "name:$NAME" \
              --info "version:$VER" \
              --info "description:$DESC" \
              --info "arch:noarch" \
              --info "license:Apache-2.0" \
              --info "origin:partexp-official" \
              --info "maintainer:sirpdboy" \
              --script "post-install:$ST/scripts/post-install" \
              --script "post-upgrade:$ST/scripts/post-install" \
              --files "$ST/data" \
              --output "$OUT/${NAME}-${VER}.apk"
            echo "built $OUT/${NAME}-${VER}.apk"
          }

          # 官方原名 + 更高版本 => apk 视为升级，不冲突
          mkpkg "$BASE/app"   "luci-app-partexp"        "2.0.5-r20261126" "LuCI Support for Automatic Partition Mount (official v2.0.5, unmodified)"
          mkpkg "$BASE/i18n"  "luci-i18n-partexp-zh-cn" "26.302.64833-r1"  "Translation for luci-app-partexp - 简体中文 (official lmo)"

          echo "=== APK magic (ADBd = v3) ==="
          for f in "$OUT"/*.apk; do echo -n "$(basename "$f"): "; od -An -c -N4 "$f"; done
          ls -lh "$OUT"/*.apk

      - name: Verify - real install + upgrade-over-official + content asserts
        run: |
          set -eu
          WS="$GITHUB_WORKSPACE"
          APP=$(ls "$WS"/dist/luci-app-partexp-*.apk)
          I18=$(ls "$WS"/dist/luci-i18n-partexp-zh-cn-*.apk)

          # 真实 apk 安装两个新包（隔离 root，--no-scripts 避免无 /bin/sh）
          rm -rf /tmp/apkroot; mkdir -p /tmp/apkroot/tmp
          echo "=== 1) apk 安装两包（官方原名，验证无文件冲突）==="
          apk add --root /tmp/apkroot --initdb --no-scripts --allow-untrusted "$APP" "$I18"

          echo "=== 3) 断言：插件本体为官方原版（未被魔改）==="
          V=/tmp/apkroot/www/luci-static/resources/view/partexp.js
          grep -q 'One click partition expansion mounting tool' "$V"
          grep -q 'callPartExpGetDevices' "$V"
          grep -q 'get_devices' /tmp/apkroot/usr/libexec/rpcd/partexp
          grep -q '"order": 54' /tmp/apkroot/usr/share/luci/menu.d/luci-app-partexp.json
          grep -q '"get_devices"' /tmp/apkroot/usr/share/rpcd/acl.d/luci-app-partexp.json
          [ -x /tmp/apkroot/usr/bin/partexp ] || [ -f /tmp/apkroot/usr/bin/partexp ]
          echo "OK: 官方原版 view/rpcd/ACL/menu 完整，分区读取关系未被破坏"

          echo "=== 4) 断言：独立中文包 lmo 到位 ==="
          LMO=/tmp/apkroot/usr/lib/lua/luci/i18n/partexp.zh-cn.lmo
          [ -f "$LMO" ]
          echo "lmo size: $(wc -c < "$LMO") bytes"
          grep -q 'uci set luci.languages.zh_cn' /tmp/apkroot/etc/uci-defaults/luci-i18n-partexp-zh-cn
          echo "OK: 中文包 partexp.zh-cn.lmo 就位"

          echo "=== 5) 断言：无自定义 nasresize 残留覆盖 ==="
          [ ! -f /tmp/apkroot/usr/share/luci/menu.d/luci-app-nasresize.json ]
          [ ! -f /tmp/apkroot/usr/sbin/nasresize ]
          echo "OK: 无自定义 view/后端残留"

          echo "=== 安装后全部文件 ==="; find /tmp/apkroot -type f | sort
          echo "INSTALL + OFFICIAL-CONTENT VERIFY PASS"

      - name: Publish release (two APKs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          TAG="partexp-official-apk"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          JSONH="Accept: application/vnd.github+json"
          curl -s -X DELETE -H "$AUTH" -H "$JSONH" "$API/releases/tags/$TAG" >/dev/null || true
          curl -s -X DELETE -H "$AUTH" -H "$JSONH" "$API/git/refs/tags/$TAG" >/dev/null || true
          REL=$(curl -s -X POST -H "$AUTH" -H "$JSONH" -H "Content-Type: application/json" "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"分区扩容 官方原版(插件包+中文包)\",\"body\":\"照搬 sirpdboy/luci-app-partexp v2.0.5 两个原版包：插件包 + 独立中文包(lmo)。同名升级覆盖固件自带版本，修复被自定义 view/ACL 搞坏的 load error 与英文界面。菜单位置/名字不变。三机型通用。\",\"target_commitish\":\"$GITHUB_SHA\",\"draft\":false,\"prerelease\":false}")
          UPLOAD_URL=$(printf '%s' "$REL" | sed -n 's/.*"upload_url": "\([^"]*\)".*/\1/p' | sed 's/{?name,label}//')
          [ -n "$UPLOAD_URL" ] || { echo "release 失败: $REL"; exit 1; }
          for f in "$GITHUB_WORKSPACE"/dist/*.apk; do
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/vnd.alpine.linux.apk" \
                 --data-binary "@$f" "$UPLOAD_URL?name=$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          echo "=== 已发布 ==="
          curl -s -H "$AUTH" -H "$JSONH" "$API/releases/tags/$TAG" | grep -oE '"browser_download_url": "[^"]+\.apk"'
